name: User story
description: A piece of product work, written from the point of view of a person in a business.
labels: ["type: feature", "needs-triage"]
body:
  - type: dropdown
    id: persona
    attributes:
      label: As a ...
      options:
        - Gastro buyer or planner (restaurant, hotel, caterer, canteen)
        - Gastro admin
        - Trade sales or operations (wholesaler, importer, distributor)
        - Trade admin
        - Producer (farm, dairy, bakery, butcher, winery)
        - Gastro or Trade viewer (read only)
        - FoodZyn platform admin
    validations:
      required: true
  - type: input
    id: want
    attributes:
      label: I want to ...
    validations:
      required: true
  - type: input
    id: so-that
    attributes:
      label: So that ...
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] Given ..., when ..., then ...
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes, designs, open questions
